name: Feature request
description: Something the package should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The package has a typed method for an operation if, and only if, Znuny ships that operation. Everything else is reached with `Znuny::call()`. That rule decides most requests, so the questions below are about it.
  - type: textarea
    id: goal
    attributes:
      label: What do you want to do?
      description: The task in your application, not the method you have in mind.
    validations:
      required: true
  - type: input
    id: operation
    attributes:
      label: Which Znuny operation is it about?
      placeholder: "Ticket::TicketSearch, or an operation of the FAQ add-on"
  - type: dropdown
    id: shipped
    attributes:
      label: Does Znuny ship that operation?
      options:
        - Yes, in Znuny itself
        - Yes, in an add-on published by the Znuny project
        - No, it exists in my installation only
        - I do not know
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today?
      description: For example a call through Znuny::call(), and what is awkward about it.
