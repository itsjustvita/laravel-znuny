name: integration

# Runs the integration suite against real Znuny instances in Docker, see tests/Integration/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/Integration/**'
      - 'composer.json'
      - '.github/workflows/integration.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/Integration/**'
      - 'composer.json'
      - '.github/workflows/integration.yml'
  schedule:
    # Mondays: notices new Znuny images and dependency releases.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  znuny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        znuny: ['6.5.26', '7.0.19', '7.1.7', '7.2.3', '7.3.8']
        timezone: ['UTC']
        include:
          - znuny: '7.3.8'
            timezone: 'Europe/Berlin'

    name: Znuny ${{ matrix.znuny }} (${{ matrix.timezone }})

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, json, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Start Znuny
        run: tests/Integration/docker/setup.sh
        env:
          ZNUNY_IMAGE: cygnusnetworks/znuny:${{ matrix.znuny }}
          ZNUNY_OTRS_TIMEZONE: ${{ matrix.timezone }}

      - name: Run the integration suite
        run: vendor/bin/phpunit --testsuite Integration
        env:
          ZNUNY_INTEGRATION_URL: http://localhost:8080/otrs/nph-genericinterface.pl/Webservice/GenericTicketConnectorREST
          ZNUNY_INTEGRATION_CLASSIC_URL: http://localhost:8080/otrs/nph-genericinterface.pl/Webservice/GenericTicketConnectorRESTClassic
          ZNUNY_INTEGRATION_OPERATION_NAME_URL: http://localhost:8080/otrs/nph-genericinterface.pl/Webservice/OperationNameREST
          ZNUNY_INTEGRATION_USERNAME: api-agent
          ZNUNY_INTEGRATION_PASSWORD: api-secret
          ZNUNY_INTEGRATION_CUSTOMER_USER: jane
          ZNUNY_INTEGRATION_CUSTOMER_PASSWORD: jane-secret
          ZNUNY_INTEGRATION_WEBHOOK_LISTEN: 0.0.0.0:8099
          ZNUNY_INTEGRATION_TIMEZONE: ${{ matrix.timezone }}

      - name: Show the Znuny log
        if: failure()
        run: docker compose -p laravel-znuny-integration -f tests/Integration/docker/docker-compose.yml logs --tail 200
