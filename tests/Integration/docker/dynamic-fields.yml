---
# Ticket dynamic fields for the integration suite, imported with Admin::DynamicField::Import.
DynamicFields:
  OrderId:
    Name: OrderId
    Label: Order ID
    ObjectType: Ticket
    FieldType: Text
    Config:
      DefaultValue: ''
  Tags:
    Name: Tags
    Label: Tags
    ObjectType: Ticket
    FieldType: Multiselect
    Config:
      DefaultValue: ''
      PossibleNone: '0'
      PossibleValues:
        alpha: Alpha
        beta: Beta
        gamma: Gamma
      TranslatableValues: '0'
      TreeView: '0'
  DueAt:
    Name: DueAt
    Label: Due at
    ObjectType: Ticket
    FieldType: DateTime
    Config:
      DefaultValue: 0
      YearsPeriod: 0
  DueOn:
    Name: DueOn
    Label: Due on
    ObjectType: Ticket
    FieldType: Date
    Config:
      DefaultValue: 0
      YearsPeriod: 0
