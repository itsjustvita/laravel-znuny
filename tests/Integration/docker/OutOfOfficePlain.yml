---
# Znuny's var/webservices/examples/OutOfOffice.yml (rel-7_3_8) without its inbound mapping, so
# the operation reads OutOfOfficeEntries directly, as in a web service put together by hand.
Debugger:
  DebugThreshold: debug
  TestMode: '0'
Description: 'Web service to update the out-of-office settings for agents, without mapping.'
Provider:
  Operation:
    OutOfOffice:
      Description: ''
      IncludeTicketData: '0'
      MappingInbound: {}
      Type: User::OutOfOffice
  Transport:
    Config:
      AdditionalHeaders: ~
      KeepAlive: ''
      MaxLength: '1000000'
      RouteOperationMapping:
        OutOfOffice:
          ParserBackend: JSON
          RequestMethod:
          - POST
          Route: /OutOfOffice
    Type: HTTP::REST
RemoteSystem: ''
Requester:
  Transport:
    Type: ''
